name: Windows ARM64

on:
  pull_request:
    branches: [main, master]
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  make:
    name: Make Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19'
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm i -D winusb-driver-generator --ignore-scripts
          node scripts/patch-pkg-fetch-node20-windows.js
          node scripts/patch-etcher-sdk-diskpart-logging.js
          vcpkg install liblzma:arm64-windows
          node scripts/patch-lzma-native-windows-arm64.js
          npm rebuild --foreground-scripts

      - name: Make Windows ARM64 package
        shell: bash
        env:
          ELECTRON_NO_ATTACH_CONSOLE: 'true'
        run: npx electron-forge make --platform=win32 --arch=arm64

      - name: Verify Windows ARM64 package
        shell: pwsh
        run: ./scripts/verify-windows-arm64-artifacts.ps1

      - name: Smoke test Windows ARM64 sidecar
        shell: bash
        run: node scripts/smoke-windows-arm64-sidecar.js

      - name: Smoke test Windows ARM64 app
        shell: pwsh
        run: ./scripts/smoke-windows-arm64-app.ps1

      - name: Upload Windows ARM64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-${{ github.sha }}
          path: |
            out/make/**/*.zip
            out/make/**/*Setup.exe
          if-no-files-found: error
