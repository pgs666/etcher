name: Windows ARM64

on:
  pull_request:
    branches: [main, master]
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  make:
    name: Make Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19'
          cache: npm

      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-gyp
            ~/.pkg-cache
          key: windows-arm64-downloads-${{ hashFiles('npm-shrinkwrap.json') }}
          restore-keys: |
            windows-arm64-downloads-

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: windows-arm64-vcpkg-liblzma-${{ hashFiles('scripts/patch-lzma-native-windows-arm64.js', 'forge.sidecar.ts') }}
          restore-keys: |
            windows-arm64-vcpkg-liblzma-

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          npm i -D winusb-driver-generator --ignore-scripts --prefer-offline --no-audit --no-fund
          node scripts/patch-pkg-fetch-node20-windows.js
          node scripts/patch-etcher-sdk-diskpart-logging.js
          node scripts/verify-etcher-sdk-diskpart-logging.js
          vcpkg install liblzma:arm64-windows
          node scripts/patch-lzma-native-windows-arm64.js
          npm rebuild --foreground-scripts

      - name: Make Windows ARM64 package
        shell: bash
        env:
          ELECTRON_NO_ATTACH_CONSOLE: 'true'
        run: npx electron-forge make --platform=win32 --arch=arm64

      - name: Verify Windows ARM64 package
        shell: pwsh
        run: ./scripts/verify-windows-arm64-artifacts.ps1

      - name: Smoke test Windows ARM64 sidecar
        shell: bash
        run: node scripts/smoke-windows-arm64-sidecar.js

      - name: Smoke test Windows ARM64 write diagnostics
        shell: bash
        run: node scripts/smoke-windows-arm64-write-diagnostics.js

      - name: Smoke test Windows ARM64 app
        shell: pwsh
        run: ./scripts/smoke-windows-arm64-app.ps1

      - name: Verify packaged icon assets
        shell: bash
        run: node scripts/verify-packaged-icon-assets.js

      - name: Generate Windows ARM64 checksums
        shell: pwsh
        run: |
          $artifactRoot = (Resolve-Path out/make).Path
          $checksumFile = Join-Path $artifactRoot 'windows-arm64-SHA256SUMS.txt'
          $files = Get-ChildItem -Path $artifactRoot -Recurse -File -Include '*.zip', '*Setup.exe', 'RELEASES', '*.nupkg' |
            Sort-Object FullName

          if ($null -eq $files -or $files.Count -eq 0) {
            throw "No Windows ARM64 distributables found under $artifactRoot"
          }

          $lines = foreach ($file in $files) {
            $relativePath = [System.IO.Path]::GetRelativePath($artifactRoot, $file.FullName).Replace('\', '/')
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $relativePath"
          }

          Set-Content -LiteralPath $checksumFile -Value $lines -Encoding ascii
          Get-Content -LiteralPath $checksumFile

      - name: Upload Windows ARM64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-${{ github.sha }}
          path: |
            out/make/**/*.zip
            out/make/**/*Setup.exe
            out/make/**/RELEASES
            out/make/**/*.nupkg
            out/make/windows-arm64-SHA256SUMS.txt
          if-no-files-found: error
